<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guia Bairro Conectado</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { font-size: 16px; background-color: #ffffff; color: #0f172a; }
    .btn-touch { min-height: 48px; min-width: 44px; font-weight: 600; }
    .card-comercio { border: 2px solid #1e293b; border-radius: 12px; }
    .badge-aberto { background-color: #047857; color: #ffffff; font-size: 0.95rem; }
    .badge-fechado { background-color: #475569; color: #ffffff; font-size: 0.95rem; }
    body.alto-contraste, body.alto-contraste .card, body.alto-contraste header {
  background-color: #000000 !important;
  color: #FFFF00 !important;
  border-color: #FFFF00 !important;
}
body.alto-contraste .btn-success {
  background-color: #FFFF00 !important;
  color: #000000 !important;
  font-weight: bold;
}
  </style>
</head>
<body>
  <main class="container py-3" style="max-width: 540px;">
    <!-- TELA 1: VITRINE E BUSCA -->
    <section id="tela-vitrine">
      <header class="d-flex justify-content-between align-items-center mb-3 gap-2">
        <h1 class="h4 fw-bold m-0">Guia Bairro Conectado</h1>
        <button id="btn-contraste" type="button" class="btn btn-outline-light btn-sm mt-2" aria-pressed="false" onclick="document.body.classList.toggle('alto-contraste'); this.setAttribute('aria-pressed', document.body.classList.contains('alto-contraste'));">
  🌓 Alto Contraste
</button>
        <button type="button" class="btn btn-success btn-touch" onclick="mostrarTela('tela-cadastro')">
          + Cadastrar negócio
        </button>
      </header>

      <div class="mb-3">
        <label for="campo-busca" class="form-label fw-semibold">O que você procura no bairro?</label>
        <input type="search" id="campo-busca" class="form-control form-control-lg border-dark"
               placeholder="Ex: marmita, chaveiro, manicure..." oninput="carregarEstabelecimentos()">
      </div>

      <div class="d-flex flex-wrap gap-2 mb-3" role="group" aria-label="Filtrar por categoria">
        <button type="button" class="btn btn-dark btn-touch filtro-cat" data-id="" onclick="selecionarCategoria(this, '')">Todos</button>
        {% for cat in categorias %}
        <button type="button" class="btn btn-outline-dark btn-touch filtro-cat" data-id="{{ cat.id_categoria }}"
                onclick="selecionarCategoria(this, '{{ cat.id_categoria }}')">{{ cat.nome }}</button>
        {% endfor %}
      </div>

      <div id="lista-comercios" class="d-grid gap-3"></div>
    </section>

    <!-- TELA 2: DETALHES DO ESTABELECIMENTO -->
    <section id="tela-detalhes" class="d-none">
      <button type="button" class="btn btn-outline-dark btn-touch mb-3" onclick="mostrarTela('tela-vitrine')">
        &larr; Voltar ao catálogo
      </button>
      <div id="conteudo-detalhes"></div>
    </section>

    <!-- TELA 3: AUTO-CADASTRO E ALERTAS -->
    <section id="tela-cadastro" class="d-none">
      <button type="button" class="btn btn-outline-dark btn-touch mb-3" onclick="mostrarTela('tela-vitrine')">
        &larr; Voltar ao catálogo
      </button>
      <h2 class="h4 fw-bold">Cadastrar meu negócio</h2>
      <p class="text-muted">Preencha os dados da sua vitrine comunitária</p>

      <div id="alerta-formulario" class="alert d-none" role="alert"></div>

      <form id="form-cadastro" class="d-grid gap-3" onsubmit="enviarCadastro(event)">
        <div>
          <label for="nome_negocio" class="form-label fw-semibold">Nome do seu negócio *</label>
          <input type="text" id="nome_negocio" class="form-control form-control-lg border-dark" required>
        </div>
        <div>
          <label for="id_categoria" class="form-label fw-semibold">Categoria *</label>
          <select id="id_categoria" class="form-select form-select-lg border-dark" required>
            {% for cat in categorias %}
            <option value="{{ cat.id_categoria }}">{{ cat.nome }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label for="telefone_whatsapp" class="form-label fw-semibold">WhatsApp com DDD (somente números) *</label>
          <input type="tel" id="telefone_whatsapp" class="form-control form-control-lg border-dark"
                 placeholder="Ex: 86999990001" required>
        </div>
        <div>
          <label for="ponto_referencia" class="form-label fw-semibold">Ponto de referência *</label>
          <input type="text" id="ponto_referencia" class="form-control form-control-lg border-dark"
                 placeholder="Ex: Próximo à Praça da Igreja" required>
        </div>
        <div class="row g-2">
          <div class="col-6">
            <label for="horario_abertura" class="form-label fw-semibold">Abertura *</label>
            <input type="time" id="horario_abertura" class="form-control form-control-lg border-dark" value="08:00" required>
          </div>
          <div class="col-6">
            <label for="horario_fechamento" class="form-label fw-semibold">Fechamento *</label>
            <input type="time" id="horario_fechamento" class="form-control form-control-lg border-dark" value="18:00" required>
          </div>
        </div>
        <div>
          <label for="item_titulo" class="form-label fw-semibold">Principal produto ou serviço (opcional)</label>
          <input type="text" id="item_titulo" class="form-control form-control-lg border-dark" placeholder="Ex: Marmita Executiva">
        </div>
        <div>
          <label for="item_preco" class="form-label fw-semibold">Preço de referência em R$ (opcional)</label>
          <input type="number" step="0.01" id="item_preco" class="form-control form-control-lg border-dark" placeholder="Ex: 16.00">
        </div>
        <button type="submit" class="btn btn-success btn-touch">Publicar meu negócio</button>
      </form>
    </section>
  </main>

  <script src="/static/js/app.js"></script>
</body>
</html>
